<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earth Temple</title>
    <!-- Inline, so no browser goes looking for /favicon.ico and logs a 404. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2315120f'/%3E%3Cpath d='M3 14Q4 8 2.5 4Q5.5 8 5 14Z' fill='%236fbf5a'/%3E%3Cpath d='M7 14Q7.5 7 8.5 2Q9.8 8 9 14Z' fill='%238fd46e'/%3E%3Cpath d='M11 14Q11.5 9 14 6Q12.6 10 13 14Z' fill='%235aa648'/%3E%3Crect x='1' y='13' width='14' height='2' rx='1' fill='%23e38b6d'/%3E%3C/svg%3E"
    />
    <script>
      // Before first paint, so a stored theme never flashes the other one.
      try {
        const theme = localStorage.getItem('et-theme');
        if (theme === 'light' || theme === 'auto') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
